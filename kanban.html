<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>1GW 目标看板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#F2F4F1; --surface:#FFFFFF; --ink:#17211C; --muted:#6E7D75;
    --line:#DCE3DD; --accent:#0E7C6B; --accent-soft:#DFF0EB; --crit:#B23A2B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1411; --surface:#151C18; --ink:#E5EDE7; --muted:#86958C;
      --line:#26312B; --accent:#53C6AE; --accent-soft:#17322C; --crit:#E88070;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  .card{
    width:min(360px, calc(100vw - 40px)); background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:28px 24px; text-align:center;
  }
  h1{font-size:18px; margin:0 0 4px; font-weight:800}
  h1 .gw{color:var(--accent)}
  p.sub{margin:0 0 18px; font-size:13px; color:var(--muted)}
  input{
    width:100%; padding:10px 12px; font-size:16px; letter-spacing:.08em; text-align:center;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; text-transform:uppercase;
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent)}
  button{
    width:100%; margin-top:12px; padding:10px; font-size:15px; font-weight:700;
    border:none; border-radius:8px; background:var(--accent); color:var(--surface); cursor:pointer;
  }
  button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  button:disabled{opacity:.6; cursor:wait}
  label.rem{display:flex; gap:6px; justify-content:center; align-items:center; margin-top:12px; font-size:12.5px; color:var(--muted); cursor:pointer}
  .err{color:var(--crit); font-size:13px; min-height:18px; margin:10px 0 0}
  .back{margin:14px 0 0; font-size:12.5px}
  .back a{color:var(--muted); text-decoration:none}
  .back a:hover{color:var(--accent)}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1><span class="gw">1GW</span> 目标看板</h1>
    <p class="sub">内容已加密,输入访问密码解锁</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="XXXX-XXXX-XXXX" aria-label="访问密码">
    <button id="btn" type="submit">解锁</button>
    <label class="rem"><input type="checkbox" id="rem" checked>在此设备记住密码</label>
    <p class="err" id="err" role="alert"></p>
    <p class="back"><a href="./">← 我的原则</a></p>
  </form>

const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pass){
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return new TextDecoder().decode(pt);
}

function show(html){ document.open(); document.write(html); document.close(); }
const norm = s => s.trim().toUpperCase();

async function attempt(pass, remember, silent){
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try{
    const html = await decrypt(pass);
    if(remember) localStorage.setItem('kb_pass', pass); else localStorage.removeItem('kb_pass');
    show(html);
  }catch(e){
    btn.disabled = false;
    if(!silent){ err.textContent = '密码不对,再试一次(注意大小写与横杠)。'; }
    localStorage.removeItem('kb_pass');
  }
}

document.getElementById('f').addEventListener('submit', ev=>{
  ev.preventDefault();
  attempt(norm(document.getElementById('pw').value), document.getElementById('rem').checked, false);
});
const saved = localStorage.getItem('kb_pass');
if(saved) attempt(saved, true, true); else document.getElementById('pw').focus();
